      power_factor: 0.9
      inertia_constant: 3.0

    governor:
      type: "PID"
      kp: 2.0
      ki: 0.10
      kd: 3.0

# ==============================================================================
# ODD (设计运行域) 配置
# ==============================================================================
odd_config:
  name: "YX工程有压五梯级系统ODD"
  version: "1.0"

  # 系统级边界
  system_boundaries:
    # 压力边界
    pressure:
      unit: "MPa"
      optimal_min: 4.5
      optimal_max: 5.0
      normal_min: 4.0
      normal_max: 5.5
      degraded_min: 3.5
      degraded_max: 6.0
      emergency_min: 3.0
      emergency_max: 6.5
      absolute_min: 0.0              # 防止负压气蚀
      absolute_max: 7.0              # 防止超压
      max_rise_rate: 0.5             # MPa/s
      max_fall_rate: 0.5

    # 流量边界
    flow:
      unit: "m³/s"
      optimal_min: 800
      optimal_max: 1000
      normal_min: 600
      normal_max: 1100
      degraded_min: 400
      degraded_max: 1200
      emergency_min: 200
      emergency_max: 1300
      absolute_min: 0
      absolute_max: 1500
      max_rise_rate: 50
      max_fall_rate: 100

    # 频率边界
    frequency:
      unit: "Hz"
      optimal_min: 49.95
      optimal_max: 50.05
      normal_min: 49.8
      normal_max: 50.2
      degraded_min: 49.5
      degraded_max: 50.5
      emergency_min: 48.0
      emergency_max: 52.0
      absolute_min: 45.0
      absolute_max: 55.0

    # 调压室水位边界
    surge_tank_level:
      unit: "m"
      optimal_min: 60
      optimal_max: 100
      normal_min: 40
      normal_max: 110
      degraded_min: 30
      degraded_max: 115
      emergency_min: 20
      emergency_max: 118
      absolute_min: 10
      absolute_max: 120

  # 瞬变边界
  transient_boundaries:
    max_simultaneous_actions: 2      # 最大同时动作站数
    min_action_interval: 10.0        # 最小动作间隔(s)
    max_guide_vane_rate: 0.05        # 导叶最大动作速率(pu/s)
    max_pressure_wave_amplitude: 0.25  # 最大压力波幅值(pu)
    max_pressure_gradient: 0.3       # 最大压力梯度(MPa/s)
    max_load_rejection_rate: 0.3     # 最大甩负荷比例
    surge_tank_min_level_ratio: 0.25
    surge_tank_max_level_ratio: 0.85

  # 级联边界
  cascade_boundaries:
    cascade_protection_enabled: true
    max_cascade_depth: 2             # 最大级联深度
    degradation_priority:
      - "maintain_pressure"          # 稳压力优先
      - "maintain_frequency"
      - "maintain_power_balance"
      - "minimize_cascade_effect"
    recovery_delay: 120.0            # 恢复延迟时间(s)
    recovery_rate: 0.05              # 恢复速率(pu/min)

# ==============================================================================
# MBD (模型驱动设计) 配置
# ==============================================================================
mbd_config:
  name: "YX工程MBD配置"

  # 设计目标权重
  design_objectives:
    safety: 0.40
    stability: 0.25
    economy: 0.20
    environment: 0.10
    flexibility: 0.05

  # 关键设计参数
  critical_parameters:
    - name: "governor_kp"
      type: "control"
      nominal: 2.5
      min: 1.0
      max: 5.0
      sensitivity: "high"

    - name: "governor_ki"
      type: "control"
      nominal: 0.15
      min: 0.05
      max: 0.5
      sensitivity: "high"

    - name: "guide_vane_rate_limit"
      type: "control"
      nominal: 0.1
      min: 0.02
      max: 0.2
      sensitivity: "medium"

    - name: "action_time_window"
      type: "coordination"
      nominal: 10.0
      min: 5.0
      max: 30.0
      sensitivity: "high"

  # 反向优化配置
  reverse_optimization:
    enabled: true
    scenarios:
      - "multi_station_coordination"
      - "cascade_degradation"
      - "oscillation_risk"

# ==============================================================================
# MAS (多智能体系统) 配置
# ==============================================================================
mas_config:
  name: "YX工程MAS配置"

  # 智能体配置
  agents:
    coordinator:
      type: "central_coordinator"
      update_interval: 1.0           # 决策周期(s)

    station_controllers:
      type: "station_controller"
      update_interval: 0.1

    unit_controllers:
      type: "unit_controller"
      update_interval: 0.02

  # 目标函数自适应
  adaptive_objective:
    enabled: true
    adaptation_rate: 0.1

    # 场景类型对权重的影响
    scenario_weights:
      normal:
        safety: 0.30
        stability: 0.25
        economy: 0.30
        flexibility: 0.15

      transient:
        safety: 0.35
        stability: 0.35
        economy: 0.20
        flexibility: 0.10

      cascade:
        safety: 0.50
        stability: 0.30
        economy: 0.15
        flexibility: 0.05

      emergency:
        safety: 0.60
        stability: 0.30
        economy: 0.05
        flexibility: 0.05

  # 降级策略
  degradation_strategy:
    levels:
      - name: "L0_OPTIMAL"
        mode: "optimal"
        description: "最优运行模式"

      - name: "L1_NORMAL"
        mode: "normal"
        description: "正常运行模式"

      - name: "L2_ALERT"
        mode: "alert"
        description: "预警模式"

      - name: "L3_DEGRADED"
        mode: "degraded"
        description: "降级运行模式"

      - name: "L4_EMERGENCY"
        mode: "emergency"
        description: "应急运行模式"

      - name: "L5_SHUTDOWN"
        mode: "shutdown"
        description: "紧急停机模式"

# ==============================================================================
# SIL/HIL验证配置
# ==============================================================================
verification_config:
  # SIL配置
  sil:
    enabled: true
    coverage_target: 100             # 场景覆盖率目标(%)
    test_categories:
      - "odd_boundary"
      - "transient"
      - "cascade_effect"
      - "degradation"
      - "coordination"
      - "protection"

  # HIL配置
  hil:
    enabled: true
    timing_requirements:
      max_latency_ms: 10.0
      max_jitter_ms: 1.0
      max_missed_cycles: 0

    test_categories:
      - "timing_verification"
      - "protection_logic"
      - "communication"
      - "signal_integrity"

  # 验证标准
  acceptance_criteria:
    odd_coverage_min: 95             # ODD覆盖率最低要求
    pass_rate_min: 90                # 通过率最低要求
    safety_violations_max: 0         # 安全违规最大允许数

# ==============================================================================
# 仿真配置
# ==============================================================================
simulation_config:
  # 基础配置
  time_step: 0.01                    # 仿真步长(s)
  default_duration: 300.0            # 默认仿真时长(s)

  # MOC水锤计算
  moc:
    courant_number: 1.0
    num_segments: 100

  # 场景库
  scenarios:
    # 正常运行场景
    normal:
      count: 20
      duration: 300

    # 暂态场景
    transient:
      count: 15
      duration: 180
      types:
        - "load_increase"
        - "load_decrease"
        - "unit_start"
        - "unit_stop"

    # 级联场景
    cascade:
      count: 10
      duration: 600

    # 边界测试场景
    boundary:
      count: 10
      duration: 300

# ==============================================================================
# 控制层级配置
# ==============================================================================
control_hierarchy:
  levels:
    - name: "现场级"
      level: 1
      controller_type: "PID"
      cycle_time: 0.02               # 20ms

    - name: "机组级"
      level: 2
      controller_type: "MPC"
      cycle_time: 0.1                # 100ms

    - name: "厂站级"
      level: 3
      controller_type: "optimization"
      cycle_time: 1.0                # 1s

    - name: "梯级调度级"
      level: 4
      controller_type: "coordination"
      cycle_time: 60.0               # 60s
