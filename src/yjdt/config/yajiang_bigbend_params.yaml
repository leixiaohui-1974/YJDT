# ==============================================================================
# 雅鲁藏布江大拐弯截弯取直引水梯级发电工程参数配置
# Yarlung Zangbo River Big Bend Cut-off Water Diversion Cascade Hydropower Project
# ==============================================================================
# 版本: 2.0
# 更新日期: 2024-01
# 说明: 面向运行能力的设计评估与运行逻辑验证配置

# ==============================================================================
# 工程概述
# ==============================================================================
project:
  name: "雅鲁藏布江大拐弯截弯取直引水梯级发电工程"
  name_en: "Yarlung Zangbo Big Bend Cascade Hydropower Project"
  code: "YX"
  version: "2.0"
  description: |
    YX工程是一个有压引水系统下的5个梯级电站级联运行系统。
    本配置面向运行能力的设计评估与运行逻辑验证。

  # 工程特点
  features:
    - 多梯级电站在有压系统条件下强耦合运行
    - 运行风险更多来自系统级瞬变、策略叠加与级联效应
    - 需要在设计阶段识别系统级隐性不稳定区

# ==============================================================================
# 梯级电站配置
# ==============================================================================
cascade_stations:
  # 第一级 - 墨脱水电站
  - id: "YJ01"
    name: "墨脱水电站"
    name_en: "Medog Hydropower Station"
    position: 1
    description: "梯级龙头电站，装机容量最大"

    hydraulic:
      rated_head: 480.0              # 额定水头 (m)
      max_head: 510.0                # 最大水头 (m)
      min_head: 450.0                # 最小水头 (m)
      rated_flow: 210.0              # 单机额定流量 (m³/s)
      tunnel_length: 25000.0         # 引水隧洞长度 (m)
      tunnel_diameter: 11.0          # 隧洞直径 (m)
      wave_speed: 1350.0             # 压力波速 (m/s)
      friction_factor: 0.015         # 摩阻系数
      water_inertia_time: 12.0       # 水流惯性时间常数 (s)

    surge_tank:
      type: "impedance"              # 阻抗式
      main_diameter: 45.0            # 大井直径 (m)
      orifice_diameter: 6.5          # 阻抗孔口直径 (m)
      height: 120.0                  # 高度 (m)
      initial_level: 60.0            # 初始水位 (m)

    turbine:
      type: "francis"                # 混流式
      num_units: 6                   # 机组数量
      rated_power: 1000.0            # 单机额定功率 (MW)
      rated_speed: 166.7             # 额定转速 (rpm)
      efficiency: 0.94               # 效率
      runaway_speed_ratio: 1.8       # 飞逸转速比
      inertia_gd2: 130000.0          # 惯性矩 GD² (t·m²)
      guide_vane_close_time: 8.0     # 导叶关闭时间 (s)
      guide_vane_open_time: 12.0     # 导叶开启时间 (s)

    generator:
      type: "synchronous"
      rated_power: 1111.0            # 额定容量 (MVA)
      rated_voltage: 20.0            # 额定电压 (kV)
      power_factor: 0.9
      inertia_constant: 4.0          # 惯性时间常数 (s)

    governor:
      type: "PID"
      kp: 2.5
      ki: 0.15
      kd: 4.0
      servo_time: 0.5
      dead_band: 0.0004
      rate_limit: 0.1

  # 第二级 - 多雄藏布水电站
  - id: "YJ02"
    name: "多雄藏布水电站"
    name_en: "Duoxiongzangbu Hydropower Station"
    position: 2

    hydraulic:
      rated_head: 450.0
      max_head: 480.0
      min_head: 420.0
      rated_flow: 200.0
      tunnel_length: 20000.0
      tunnel_diameter: 10.0
      wave_speed: 1300.0
      friction_factor: 0.015
      water_inertia_time: 10.0

    surge_tank:
      type: "impedance"
      main_diameter: 40.0
      orifice_diameter: 6.0
      height: 100.0
      initial_level: 50.0

    turbine:
      type: "francis"
      num_units: 4
      rated_power: 800.0
      rated_speed: 166.7
      efficiency: 0.93
      runaway_speed_ratio: 1.8
      inertia_gd2: 100000.0
      guide_vane_close_time: 7.5
      guide_vane_open_time: 11.0

    generator:
      type: "synchronous"
      rated_power: 889.0
      rated_voltage: 20.0
      power_factor: 0.9
      inertia_constant: 4.0

    governor:
      type: "PID"
      kp: 2.5
      ki: 0.15
      kd: 4.0

  # 第三级 - 达木水电站
  - id: "YJ03"
    name: "达木水电站"
    name_en: "Damu Hydropower Station"
    position: 3

    hydraulic:
      rated_head: 400.0
      max_head: 430.0
      min_head: 370.0
      rated_flow: 180.0
      tunnel_length: 15000.0
      tunnel_diameter: 9.0
      wave_speed: 1250.0
      friction_factor: 0.014
      water_inertia_time: 8.0

    surge_tank:
      type: "differential"
      main_diameter: 35.0
      riser_diameter: 8.0
      height: 90.0
      initial_level: 45.0

    turbine:
      type: "francis"
      num_units: 3
      rated_power: 600.0
      rated_speed: 150.0
      efficiency: 0.93
      runaway_speed_ratio: 1.75
      inertia_gd2: 80000.0
      guide_vane_close_time: 7.0
      guide_vane_open_time: 10.0

    generator:
      type: "synchronous"
      rated_power: 667.0
      rated_voltage: 18.0
      power_factor: 0.9
      inertia_constant: 3.5

    governor:
      type: "PID"
      kp: 2.3
      ki: 0.12
      kd: 3.5

  # 第四级 - 巴玉水电站
  - id: "YJ04"
    name: "巴玉水电站"
    name_en: "Bayu Hydropower Station"
    position: 4

    hydraulic:
      rated_head: 350.0
      max_head: 380.0
      min_head: 320.0
      rated_flow: 160.0
      tunnel_length: 12000.0
      tunnel_diameter: 8.0
      wave_speed: 1200.0
      friction_factor: 0.014
      water_inertia_time: 7.0

    surge_tank:
      type: "differential"
      main_diameter: 30.0
      riser_diameter: 7.0
      height: 80.0
      initial_level: 40.0

    turbine:
      type: "francis"
      num_units: 3
      rated_power: 500.0
      rated_speed: 150.0
      efficiency: 0.92
      runaway_speed_ratio: 1.75
      inertia_gd2: 70000.0
      guide_vane_close_time: 6.5
      guide_vane_open_time: 9.5

    generator:
      type: "synchronous"
      rated_power: 556.0
      rated_voltage: 18.0
      power_factor: 0.9
      inertia_constant: 3.5

    governor:
      type: "PID"
      kp: 2.3
      ki: 0.12
      kd: 3.5

  # 第五级 - 通德水电站
  - id: "YJ05"
    name: "通德水电站"
    name_en: "Tongde Hydropower Station"
    position: 5
