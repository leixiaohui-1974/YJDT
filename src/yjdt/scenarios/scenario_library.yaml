# -*- coding: utf-8 -*-
# 雅江水电梯级分层分布式智能系统 - 全场景库配置
# Yajiang Hydropower Cascade - Complete Scenario Library Configuration
#
# 场景覆盖率目标: 100%
# 设计标准: 万年一遇场景安全可控
#
# 场景分类体系:
# ├── A. 正常运行场景 (Normal Operation)
# ├── B. 暂态过程场景 (Transient Process)
# ├── C. 设备故障场景 (Equipment Fault)
# ├── D. 电网事故场景 (Grid Accident)
# ├── E. 水力事故场景 (Hydraulic Accident)
# ├── F. 自然灾害场景 (Natural Disaster)
# ├── G. 人为事故场景 (Human-caused Accident)
# ├── H. 多重故障场景 (Multiple Fault Combination)
# └── I. 万年一遇极端场景 (Once-in-10000-years Extreme)

metadata:
  version: "2.0.0"
  total_scenarios: 500+
  coverage_target: 100%
  safety_standard: "万年一遇安全"
  update_date: "2024-01-01"

# =============================================================================
# A. 正常运行场景 (Normal Operation Scenarios)
# 概率: 常态 | 安全等级: 绿色
# =============================================================================
normal_operation:
  # A1. 稳态运行场景族
  steady_state:
    - id: "A1-01"
      name: "额定工况稳态运行"
      probability: "常态"
      parameters:
        power_ratio: 1.0
        head_ratio: 1.0
        frequency: 50.0
      acceptance:
        frequency_deviation: 0.02
        power_deviation: 0.01
        efficiency_min: 0.92

    - id: "A1-02"
      name: "50%负荷稳态运行"
      probability: "常态"
      parameters:
        power_ratio: 0.5
        head_ratio: 1.0
      acceptance:
        frequency_deviation: 0.02
        vibration_limit: 0.08

    - id: "A1-03"
      name: "最小技术出力运行"
      probability: "常态"
      parameters:
        power_ratio: 0.25
        head_ratio: 1.0
      acceptance:
        stability: true
        cavitation_free: true

    - id: "A1-04"
      name: "最大出力运行"
      probability: "常态"
      parameters:
        power_ratio: 1.1  # 短时过负荷
        head_ratio: 1.0
      acceptance:
        temperature_limit: 85
        duration_limit: 3600  # 1小时

    - id: "A1-05"
      name: "低水头运行"
      probability: "季节性"
      parameters:
        power_ratio: 0.8
        head_ratio: 0.85
      acceptance:
        efficiency_min: 0.88
        cavitation_margin: 0.1

    - id: "A1-06"
      name: "高水头运行"
      probability: "季节性"
      parameters:
        power_ratio: 1.0
        head_ratio: 1.15
      acceptance:
        pressure_limit: 1.2
        seal_stress_limit: 0.9

    - id: "A1-07"
      name: "振动区边界运行"
      probability: "偶发"
      parameters:
        power_ratio: 0.42  # 振动区边界
      acceptance:
        vibration_limit: 0.10
        duration_limit: 300

  # A2. 负荷跟踪场景族
  load_following:
    - id: "A2-01"
      name: "AGC正常调节"
      probability: "常态"
      parameters:
        load_change_rate: 10  # MW/min
        regulation_range: 0.2  # ±20%
      acceptance:
        response_time: 30
        tracking_error: 0.02

    - id: "A2-02"
      name: "一次调频响应"
      probability: "常态"
      parameters:
        frequency_deviation: -0.2
        droop: 0.05
      acceptance:
        response_time: 5
        power_change_accuracy: 0.95

    - id: "A2-03"
      name: "二次调频响应"
      probability: "常态"
      parameters:
        frequency_deviation: -0.1
        recovery_target: 50.0
      acceptance:
        recovery_time: 300
        frequency_accuracy: 0.01

    - id: "A2-04"
      name: "快速负荷响应"
      probability: "偶发"
      parameters:
        load_change_rate: 50  # MW/min
        change_magnitude: 0.3
      acceptance:
        response_time: 10
        overshoot: 0.05

    - id: "A2-05"
      name: "日负荷曲线跟踪"
      probability: "常态"
      parameters:
        cycle_period: 86400  # 24小时
        peak_valley_ratio: 2.0
      acceptance:
        tracking_error: 0.03
        efficiency_average: 0.90

# =============================================================================
# B. 暂态过程场景 (Transient Process Scenarios)
# 概率: 年/月级 | 安全等级: 黄色
# =============================================================================
transient_process:
  # B1. 启动场景族
  startup:
    - id: "B1-01"
      name: "正常冷态启动"
      probability: "年级"
      parameters:
        initial_state: "cold"
        target_power: 1.0
        startup_mode: "normal"
      acceptance:
        startup_time: 600
        sync_accuracy: 0.1
        vibration_limit: 0.10

    - id: "B1-02"
      name: "热态启动"
      probability: "月级"
      parameters:
        initial_state: "hot"
        target_power: 1.0
        startup_mode: "fast"
      acceptance:
        startup_time: 180
        thermal_stress: 0.8

    - id: "B1-03"
      name: "黑启动"
      probability: "罕见"
      parameters:
        grid_state: "blackout"
        auxiliary_power: "diesel"
      acceptance:
        startup_time: 1800
        voltage_buildup_time: 60

    - id: "B1-04"
      name: "调相启动"
      probability: "偶发"
      parameters:
        operation_mode: "condenser"
        reactive_power_target: 200  # MVar
      acceptance:
        mode_switch_time: 120
        var_accuracy: 0.05

    - id: "B1-05"
      name: "抽水启动"
      probability: "偶发"  # 如有抽蓄功能
      parameters:
        operation_mode: "pump"
        pump_power: 800
      acceptance:
        startup_time: 300
        pump_efficiency: 0.88

  # B2. 停机场景族
  shutdown:
    - id: "B2-01"
      name: "正常停机"
      probability: "月级"
      parameters:
        shutdown_mode: "normal"
        load_ramp_rate: 20  # MW/min
      acceptance:
        shutdown_time: 600
        brake_application: "auto"

    - id: "B2-02"
      name: "快速停机"
      probability: "偶发"
      parameters:
        shutdown_mode: "fast"
        trigger: "operator_command"
      acceptance:
        shutdown_time: 120
        max_water_hammer: 1.3

    - id: "B2-03"
      name: "紧急停机"
      probability: "罕见"
      parameters:
        shutdown_mode: "emergency"
        trigger: "protection_action"
      acceptance:
        shutdown_time: 45
        max_water_hammer: 1.4
        equipment_safe: true

    - id: "B2-04"
      name: "事故停机"
      probability: "极罕见"
      parameters:
        shutdown_mode: "accident"
        trigger: "major_fault"
      acceptance:
        shutdown_time: 30
        personnel_safe: true

  # B3. 甩负荷场景族
  load_rejection:
    - id: "B3-01"
      name: "25%甩负荷"
      probability: "年级"
      parameters:
        initial_power: 1.0
        rejection_ratio: 0.25
      acceptance:
        max_overspeed: 1.15
        max_pressure_rise: 1.15
        settling_time: 30

    - id: "B3-02"
      name: "50%甩负荷"
      probability: "年级"
      parameters:
        initial_power: 1.0
        rejection_ratio: 0.5
      acceptance:
        max_overspeed: 1.25
        max_pressure_rise: 1.25
        settling_time: 45

    - id: "B3-03"
      name: "75%甩负荷"
      probability: "偶发"
      parameters:
        initial_power: 1.0
        rejection_ratio: 0.75
      acceptance:
        max_overspeed: 1.35
        max_pressure_rise: 1.35
        settling_time: 55

    - id: "B3-04"
      name: "100%甩负荷"
      probability: "罕见"
      parameters:
        initial_power: 1.0
        rejection_ratio: 1.0
      acceptance:
        max_overspeed: 1.45
        max_pressure_rise: 1.50
        settling_time: 60

    - id: "B3-05"
      name: "低水头满载甩负荷"
      probability: "罕见"
      parameters:
        initial_power: 0.9
        head_ratio: 0.85
        rejection_ratio: 1.0
      acceptance:
        max_overspeed: 1.50
        cavitation_free: true

    - id: "B3-06"
      name: "高水头满载甩负荷"
      probability: "罕见"
      parameters:
        initial_power: 1.0
        head_ratio: 1.15
        rejection_ratio: 1.0
      acceptance:
        max_overspeed: 1.40
        max_pressure_rise: 1.55
        seal_safe: true

    - id: "B3-07"
      name: "连续甩负荷"
      probability: "极罕见"
      parameters:
        rejection_sequence: [0.3, 0.3, 0.4]
        interval: 5  # 秒
      acceptance:
        max_overspeed: 1.45
        cumulative_stress: 0.9

  # B4. 增负荷场景族
  load_increase:
    - id: "B4-01"
      name: "阶跃增负荷10%"
      probability: "常态"
      parameters:
        step_size: 0.1
        ramp_time: 0
      acceptance:
        response_time: 30
        undershoot: 0.02

    - id: "B4-02"
      name: "阶跃增负荷30%"
      probability: "偶发"
      parameters:
        step_size: 0.3
        ramp_time: 0
      acceptance:
        response_time: 60
        frequency_nadir: 49.5

    - id: "B4-03"
      name: "快速增负荷至满载"
      probability: "罕见"
      parameters:
        initial_power: 0.5
        target_power: 1.0
        ramp_rate: 100  # MW/min
      acceptance:
        response_time: 300
        thermal_stress: 0.85

# =============================================================================
# C. 设备故障场景 (Equipment Fault Scenarios)
# 概率: 年级至罕见 | 安全等级: 黄色-橙色
# =============================================================================
equipment_fault:
  # C1. 传感器故障场景族
  sensor_fault:
    - id: "C1-01"
      name: "压力传感器偏置故障"
      probability: "年级"
      fault_type: "bias"
      location: "penstock_pressure"
      parameters:
        bias_magnitude: 0.1  # 10%偏置
      acceptance:
        detection_time: 5
        safe_operation: true

    - id: "C1-02"
      name: "压力传感器卡死故障"
      probability: "年级"
      fault_type: "stuck"
      location: "penstock_pressure"
      acceptance:
        detection_time: 10
        backup_activation: true

    - id: "C1-03"
      name: "流量传感器漂移故障"
      probability: "年级"
      fault_type: "drift"
      location: "flow_meter"
      parameters:
        drift_rate: 0.01  # 1%/小时
      acceptance:
        detection_time: 60
        calibration_alarm: true

    - id: "C1-04"
      name: "转速传感器丢失"
      probability: "罕见"
      fault_type: "loss"
      location: "speed_sensor"
      acceptance:
        detection_time: 0.1
        backup_activation: 0.5
        protection_action: true

    - id: "C1-05"
      name: "振动传感器噪声"
      probability: "偶发"
      fault_type: "noise"
      location: "vibration_sensor"
      parameters:
        noise_level: 5.0  # 5倍正常噪声
      acceptance:
        filtering_effective: true
        false_alarm_prevented: true

    - id: "C1-06"
      name: "温度传感器开路"
      probability: "年级"
      fault_type: "open_circuit"
      location: "bearing_temperature"
      acceptance:
        detection_time: 1
        backup_monitoring: true

    - id: "C1-07"
      name: "水位传感器死区"
      probability: "偶发"
      fault_type: "dead_zone"
      location: "reservoir_level"
      parameters:
        dead_zone: 0.5  # 0.5m死区
      acceptance:
        detection_time: 60
        manual_verification: true

    - id: "C1-08"
      name: "多传感器同时故障"
      probability: "极罕见"
      fault_type: "multiple"
      locations: ["pressure", "flow", "speed"]
      acceptance:
        detection_time: 2
        emergency_shutdown: true

  # C2. 执行器故障场景族
  actuator_fault:
    - id: "C2-01"
      name: "导叶卡死-全开位置"
      probability: "罕见"
      fault_type: "stuck_open"
      location: "guide_vane"
      acceptance:
        detection_time: 5
        backup_closure: true
        emergency_valve: true

    - id: "C2-02"
      name: "导叶卡死-中间位置"
      probability: "罕见"
      fault_type: "stuck_middle"
      location: "guide_vane"
      parameters:
        stuck_position: 0.6
      acceptance:
        detection_time: 5
        safe_operation: true
        maintenance_alarm: true

    - id: "C2-03"
      name: "导叶卡死-全关位置"
      probability: "极罕见"
      fault_type: "stuck_closed"
      location: "guide_vane"
      acceptance:
        detection_time: 5
        unit_trip: true

    - id: "C2-04"
      name: "导叶动作迟缓"
      probability: "偶发"
      fault_type: "sluggish"
      location: "guide_vane"
      parameters:
        speed_reduction: 0.5  # 速度降低50%
      acceptance:
        detection_time: 10
        control_adaptation: true

    - id: "C2-05"
      name: "进水阀卡死"
      probability: "极罕见"
      fault_type: "stuck"
      location: "inlet_valve"
      acceptance:
        detection_time: 10
        emergency_procedure: true

    - id: "C2-06"
      name: "事故闸门拒动"
      probability: "极罕见"
      fault_type: "failure_to_operate"
      location: "emergency_gate"
      acceptance:
        detection_time: 1
        backup_gate: true
        manual_operation: true

    - id: "C2-07"
      name: "励磁系统故障"
      probability: "罕见"
      fault_type: "excitation_loss"
      location: "exciter"
      acceptance:
        detection_time: 0.5
        backup_excitation: true
        generator_protection: true

    - id: "C2-08"
      name: "断路器拒动"
      probability: "极罕见"
      fault_type: "breaker_failure"
      location: "main_breaker"
      acceptance:
        detection_time: 0.1
        backup_breaker: true

    - id: "C2-09"
      name: "调速器油压丧失"
      probability: "极罕见"
      fault_type: "hydraulic_loss"
      location: "governor_oil"
      acceptance:
        detection_time: 5
        accumulator_backup: 60  # 秒
        emergency_shutdown: true

  # C3. 控制系统故障场景族
  control_fault:
    - id: "C3-01"
      name: "调速器控制器故障"
      probability: "罕见"
      fault_type: "controller_failure"
      location: "governor_plc"
      acceptance:
        detection_time: 0.5
        backup_controller: true
        bumpless_transfer: true

    - id: "C3-02"
      name: "励磁控制器故障"
      probability: "罕见"
      fault_type: "controller_failure"
      location: "avr"
      acceptance:
        detection_time: 0.5
        manual_control: true

    - id: "C3-03"
      name: "上位机故障"
      probability: "偶发"
      fault_type: "scada_failure"
      location: "operator_station"
      acceptance:
        detection_time: 1
        local_control: true
        backup_hmi: true

    - id: "C3-04"
      name: "通信中断-机组级"
      probability: "偶发"
      fault_type: "communication_loss"
      location: "unit_level"
      acceptance:
        detection_time: 1
        autonomous_operation: true

    - id: "C3-05"
      name: "通信中断-厂站级"
      probability: "罕见"
      fault_type: "communication_loss"
      location: "plant_level"
      acceptance:
        detection_time: 5
        local_dispatch: true

    - id: "C3-06"
      name: "通信中断-梯级级"
      probability: "罕见"
      fault_type: "communication_loss"
      location: "cascade_level"
      acceptance:
        detection_time: 60
        independent_operation: true

    - id: "C3-07"
      name: "软件死锁"
      probability: "极罕见"
      fault_type: "software_deadlock"
      location: "control_system"
      acceptance:
        watchdog_activation: 2
        auto_restart: true

    - id: "C3-08"
      name: "时钟同步丢失"
      probability: "偶发"
      fault_type: "clock_sync_loss"
      location: "time_system"
      acceptance:
        detection_time: 1
        local_clock: true
        resync_procedure: true

# =============================================================================
# D. 电网事故场景 (Grid Accident Scenarios)
# 概率: 年级至极罕见 | 安全等级: 橙色-红色
# =============================================================================
grid_accident:
  # D1. 频率异常场景族
  frequency_abnormal:
    - id: "D1-01"
      name: "电网频率低至49.5Hz"
      probability: "年级"
      parameters:
        frequency_min: 49.5
        duration: 30
      acceptance:
        power_increase: true
        stable_operation: true

    - id: "D1-02"
      name: "电网频率低至49.0Hz"
      probability: "偶发"
      parameters:
        frequency_min: 49.0
        duration: 10
      acceptance:
        ufls_stage1: false
        stable_operation: true

    - id: "D1-03"
      name: "电网频率低至48.5Hz"
      probability: "罕见"
      parameters:
        frequency_min: 48.5
        duration: 5
      acceptance:
        ufls_participation: true
        equipment_safe: true

    - id: "D1-04"
      name: "电网频率低至48.0Hz"
      probability: "极罕见"
      parameters:
        frequency_min: 48.0
        duration: 2
      acceptance:
        trip_allowed: true
        equipment_protected: true

    - id: "D1-05"
      name: "电网频率高至50.5Hz"
      probability: "偶发"
      parameters:
        frequency_max: 50.5
        duration: 30
      acceptance:
        power_decrease: true
        stable_operation: true

    - id: "D1-06"
      name: "电网频率高至51.0Hz"
      probability: "罕见"
      parameters:
        frequency_max: 51.0
        duration: 10
      acceptance:
        ofgr_action: true

    - id: "D1-07"
      name: "频率振荡"
      probability: "罕见"
      parameters:
        oscillation_amplitude: 0.3
        oscillation_frequency: 0.5  # Hz
      acceptance:
        damping_positive: true
        pss_effective: true

  # D2. 电压异常场景族
  voltage_abnormal:
    - id: "D2-01"
      name: "电网电压跌落10%"
      probability: "年级"
      parameters:
        voltage_dip: 0.1
        duration: 1
      acceptance:
        lvrt_success: true
        reactive_support: true

    - id: "D2-02"
      name: "电网电压跌落30%"
      probability: "偶发"
      parameters:
        voltage_dip: 0.3
        duration: 0.5
      acceptance:
        lvrt_success: true
        current_limit: true

    - id: "D2-03"
      name: "电网电压跌落50%"
      probability: "罕见"
      parameters:
        voltage_dip: 0.5
        duration: 0.2
      acceptance:
        lvrt_success: true
        stability_maintained: true

    - id: "D2-04"
      name: "三相短路故障"
      probability: "极罕见"
      parameters:
        fault_type: "three_phase"
        clearing_time: 0.1
      acceptance:
        generator_protected: true
        transient_stability: true

    - id: "D2-05"
      name: "单相接地故障"
      probability: "偶发"
      parameters:
        fault_type: "single_phase"
        fault_resistance: 10
      acceptance:
        protection_action: true
        arc_extinction: true

    - id: "D2-06"
      name: "电压骤升"
      probability: "偶发"
      parameters:
        voltage_rise: 0.15
        duration: 0.5
      acceptance:
        hvrt_success: true
        insulation_safe: true

  # D3. 电网解列场景族
  grid_separation:
    - id: "D3-01"
      name: "计划解列"
      probability: "年级"
      parameters:
        separation_type: "planned"
        load_balance: true
      acceptance:
        frequency_control: true
        stable_island: true

    - id: "D3-02"
      name: "非计划解列-负荷盈余"
      probability: "罕见"
      parameters:
        separation_type: "unplanned"
        power_imbalance: -0.2  # 发电>负荷
      acceptance:
        frequency_rise_limited: true
        load_shedding: false

    - id: "D3-03"
      name: "非计划解列-发电盈余"
      probability: "罕见"
      parameters:
        separation_type: "unplanned"
        power_imbalance: 0.3  # 负荷>发电
      acceptance:
        frequency_drop_limited: true
        ufls_coordination: true

    - id: "D3-04"
      name: "孤岛运行"
      probability: "极罕见"
      parameters:
        island_load: 500  # MW
        duration: 3600
      acceptance:
        frequency_regulation: true
        voltage_regulation: true
        load_following: true

    - id: "D3-05"
